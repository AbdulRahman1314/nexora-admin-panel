<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexora Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>html,body{margin:0;padding:0;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;
function Ico({ size = 16, children, style, className }) {
  return <span className={className} style={{ fontSize: size, lineHeight: 1, display: "inline-block", ...style }}>{children}</span>;
}
const LayoutDashboard = (p) => <Ico {...p}>📊</Ico>;
const BookOpen = (p) => <Ico {...p}>📖</Ico>;
const ShoppingBag = (p) => <Ico {...p}>🛍️</Ico>;
const Users = (p) => <Ico {...p}>👥</Ico>;
const Plus = (p) => <Ico {...p}>+</Ico>;
const Pencil = (p) => <Ico {...p}>✏️</Ico>;
const Archive = (p) => <Ico {...p}>🗄️</Ico>;
const Trash2 = (p) => <Ico {...p}>🗑</Ico>;
const X = (p) => <Ico {...p}>✕</Ico>;
const Loader2 = (p) => <Ico {...p}>⏳</Ico>;
const LogOut = (p) => <Ico {...p}>🚪</Ico>;
const Check = ({ color, ...p }) => <Ico {...p} style={{ color }}>✔</Ico>;
const ChevronLeft = (p) => <Ico {...p}>‹</Ico>;
const Search = (p) => <Ico {...p}>🔍</Ico>;
const API_BASE = "https://nexora-backend-production-a8dd.up.railway.app";

async function api(path, { method = "GET", body, token } = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    method,
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: `Bearer ${token}` } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data?.error || "Request failed.");
  return data;
}

const AUDIENCES = ["kids", "men", "women", "parents", "careers"];
const SUBCATS = {
  kids: ["Early Learning", "Stories", "Creativity", "Science", "General Knowledge", "Activity Books", "Problem Solving", "Technology", "Future Skills"],
  men: ["Career", "Business", "Skills", "Financial Education", "Leadership", "Productivity", "Technology", "Personal Development", "Entrepreneurship"],
  women: ["Career", "Education", "Skills", "Entrepreneurship", "Leadership", "Technology", "Personal Development", "Financial Education", "Creativity"],
  parents: ["Child Education", "Parenting", "School Selection", "Career Planning", "Future Skills", "Technology & AI", "Learning Methods", "Teen Development"],
  careers: ["Career Planning", "Technology", "AI", "Business", "Design", "Programming", "Digital Skills", "Communication", "Freelancing"],
};

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
.adm-root { font-family:'Inter',sans-serif; background:#F3F1EB; color:#20242B; min-height:100vh; }
.adm-root .serif { font-family:'Fraunces',serif; }
.adm-root * { box-sizing:border-box; }
.adm-root button { font-family:inherit; cursor:pointer; }
.card { background:#fff; border:1px solid #E1DACB; }
.btn-primary { background:#1C2B4A; color:#fff; }
.btn-outline { background:transparent; border:1px solid #D8D0BC; color:#20242B; }
.text-sec { color:#6B6E76; }
.input-field { background:#FBF9F3; border:1px solid #D8D0BC; color:#20242B; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.badge { font-size:11px; padding:2px 8px; border-radius:3px; font-weight:600; }
.badge-green { background:#2F7A4F; color:#fff; }
.badge-gray { background:#9AA1AE; color:#fff; }
`;

function App() {
  const [token, setToken] = useState(null);
  const [user, setUser] = useState(null);
  const [loginForm, setLoginForm] = useState({ email: "", password: "" });
  const [loginBusy, setLoginBusy] = useState(false);
  const [loginError, setLoginError] = useState(null);
  const [nav, setNav] = useState("dashboard");
  const [toast, setToast] = useState(null);

  function flash(msg) {
    setToast(msg);
    window.clearTimeout(flash._t);
    flash._t = window.setTimeout(() => setToast(null), 2500);
  }

  async function handleLogin(e) {
    e.preventDefault();
    setLoginBusy(true); setLoginError(null);
    try {
      const data = await api("/api/auth/login", { method: "POST", body: loginForm });
      if (data.user.role !== "ADMIN") {
        setLoginError("This account is not an admin. Log in with an admin account.");
        setLoginBusy(false);
        return;
      }
      setToken(data.token); setUser(data.user);
    } catch (e) {
      setLoginError(e.message);
    } finally {
      setLoginBusy(false);
    }
  }

  function logout() { setToken(null); setUser(null); setNav("dashboard"); }

  if (!token) {
    return (
      <div className="adm-root flex items-center justify-center min-h-screen p-4">
        <style>{CSS}</style>
        <form onSubmit={handleLogin} className="card rounded-md p-6 w-full max-w-sm">
          <h1 className="serif text-xl font-semibold mb-1">Nexora Admin</h1>
          <p className="text-sm text-sec mb-5">Log in with an admin account.</p>
          <div className="flex flex-col gap-3">
            <input required type="email" placeholder="Email" value={loginForm.email}
              onChange={(e) => setLoginForm((f) => ({ ...f, email: e.target.value }))}
              className="input-field rounded px-3 py-2.5 text-sm" />
            <input required type="password" placeholder="Password" value={loginForm.password}
              onChange={(e) => setLoginForm((f) => ({ ...f, password: e.target.value }))}
              className="input-field rounded px-3 py-2.5 text-sm" />
            {loginError && <p className="text-xs rounded px-2 py-1.5" style={{ background: "#AE4436", color: "#fff" }}>{loginError}</p>}
            <button disabled={loginBusy} className="btn-primary rounded-full py-2.5 text-sm font-medium flex items-center justify-center gap-2 disabled:opacity-60">
              {loginBusy && <Loader2 size={14} className="spin" />} Log in
            </button>
          </div>
        </form>
      </div>
    );
  }

  return (
    <div className="adm-root">
      <style>{CSS}</style>
      <header className="card border-b sticky top-0 z-30 flex items-center justify-between px-4 md:px-6 h-14">
        <span className="serif font-semibold">Nexora Admin</span>
        <div className="flex items-center gap-3">
          <span className="text-xs text-sec hidden sm:inline">{user.email}</span>
          <button onClick={logout} className="p-2 rounded flex items-center gap-1 text-xs"><LogOut size={16} /> Log out</button>
        </div>
      </header>

      <div className="flex">
        <nav className="hidden md:flex flex-col gap-1 w-52 shrink-0 p-4 border-r" style={{ borderColor: "#E1DACB" }}>
          {[
            ["dashboard", "Dashboard", LayoutDashboard],
            ["books", "Books", BookOpen],
            ["orders", "Orders", ShoppingBag],
            ["users", "Users", Users],
          ].map(([id, label, Icon]) => (
            <button key={id} onClick={() => setNav(id)}
              className={`flex items-center gap-2 px-3 py-2 rounded text-sm text-left ${nav === id ? "btn-primary" : ""}`}>
              <Icon size={16} /> {label}
            </button>
          ))}
        </nav>

        <div className="flex-1 p-4 md:p-6 max-w-5xl">
          <div className="flex md:hidden gap-2 mb-4 overflow-x-auto">
            {[["dashboard", "Dashboard"], ["books", "Books"], ["orders", "Orders"], ["users", "Users"]].map(([id, label]) => (
              <button key={id} onClick={() => setNav(id)} className={`px-3 py-1.5 rounded-full text-xs whitespace-nowrap border ${nav === id ? "btn-primary" : "btn-outline"}`}>{label}</button>
            ))}
          </div>

          {nav === "dashboard" && <Dashboard token={token} />}
          {nav === "books" && <Books token={token} flash={flash} />}
          {nav === "orders" && <Orders token={token} />}
          {nav === "users" && <UsersView token={token} />}
        </div>
      </div>

      {toast && (
        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 card rounded-full px-4 py-2 text-sm shadow-lg z-50">{toast}</div>
      )}
    </div>
  );
}

function StatCard({ label, value }) {
  return (
    <div className="card rounded-md p-4">
      <div className="text-xs text-sec">{label}</div>
      <div className="serif text-2xl font-semibold mt-1">{value}</div>
    </div>
  );
}

function Dashboard({ token }) {
  const [stats, setStats] = useState(null);
  const [error, setError] = useState(null);
  useEffect(() => { api("/api/admin/stats", { token }).then(setStats).catch((e) => setError(e.message)); }, [token]);
  if (error) return <p className="text-sm">{error}</p>;
  if (!stats) return <Loader2 size={20} className="spin" />;
  return (
    <div>
      <h1 className="serif text-2xl font-semibold mb-5">Dashboard</h1>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <StatCard label="Total Users" value={stats.totalUsers} />
        <StatCard label="Total Books" value={stats.totalBooks} />
        <StatCard label="Published Books" value={stats.publishedBooks} />
        <StatCard label="Total Orders" value={stats.totalOrders} />
        <StatCard label="Paid Orders" value={stats.paidOrders} />
        <StatCard label="Revenue (₹)" value={stats.revenue} />
        <StatCard label="Active Rentals" value={stats.activeRentals} />
      </div>
    </div>
  );
}

function emptyBook() {
  return {
    title: "", author: "", description: "", whoFor: "", audience: "kids", subcategory: SUBCATS.kids[0],
    ageGroup: "", access: "PURCHASE", price: 0, originalPrice: "", rentDurationDays: "",
    language: "English", pages: "", format: "EPUB / PDF", isPublished: false,
    fileUrl: "", coverUrl: "", whatYouLearn: [], toc: [], badges: [], releaseAt: "",
  };
}

function Books({ token, flash }) {
  const [books, setBooks] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null); // book object or null
  const [creating, setCreating] = useState(false);
  const [query, setQuery] = useState("");

  const load = useCallback(() => {
    setLoading(true);
    api("/api/admin/books", { token }).then(setBooks).catch((e) => flash(e.message)).finally(() => setLoading(false));
  }, [token]);

  useEffect(() => { load(); }, [load]);

  async function saveNew(data) {
    try {
      await api("/api/admin/books", { method: "POST", token, body: data });
      flash("Book created"); setCreating(false); load();
    } catch (e) { flash(e.message); }
  }

  async function saveEdit(id, data) {
    try {
      await api(`/api/admin/books/${id}`, { method: "PATCH", token, body: data });
      flash("Book updated"); setEditing(null); load();
    } catch (e) { flash(e.message); }
  }

  async function togglePublish(book) {
    try {
      await api(`/api/admin/books/${book.id}`, { method: "PATCH", token, body: { isPublished: !book.isPublished } });
      flash(book.isPublished ? "Unpublished" : "Published"); load();
    } catch (e) { flash(e.message); }
  }

  async function archive(book) {
    if (!window.confirm(`Unpublish "${book.title}"?`)) return;
    try {
      await api(`/api/admin/books/${book.id}`, { method: "DELETE", token });
      flash("Archived"); load();
    } catch (e) { flash(e.message); }
  }

  const filtered = books.filter((b) => b.title.toLowerCase().includes(query.toLowerCase()));

  return (
    <div>
      <div className="flex items-center justify-between mb-5 gap-2 flex-wrap">
        <h1 className="serif text-2xl font-semibold">Books</h1>
        <button onClick={() => setCreating(true)} className="btn-primary rounded-full px-4 py-2 text-sm font-medium flex items-center gap-1.5"><Plus size={15} /> Add Book</button>
      </div>
      <div className="flex items-center gap-2 mb-4 input-field rounded-full px-3 py-2 max-w-xs">
        <Search size={15} className="text-sec" />
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search books..." className="bg-transparent outline-none text-sm w-full" />
      </div>

      {loading ? <Loader2 size={20} className="spin" /> : (
        <div className="card rounded-md overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr className="text-left text-xs text-sec border-b" style={{ borderColor: "#E1DACB" }}>
                <th className="p-3">Title</th><th className="p-3">Audience</th><th className="p-3">Access</th>
                <th className="p-3">Price</th><th className="p-3">Status</th><th className="p-3">Actions</th>
              </tr></thead>
              <tbody>
                {filtered.map((b) => (
                  <tr key={b.id} className="border-b" style={{ borderColor: "#EFEAE0" }}>
                    <td className="p-3 font-medium max-w-[180px] truncate">{b.title}</td>
                    <td className="p-3 text-sec">{b.audience}</td>
                    <td className="p-3 text-sec">{b.access}</td>
                    <td className="p-3">₹{b.price}</td>
                    <td className="p-3"><span className={`badge ${b.isPublished ? "badge-green" : "badge-gray"}`}>{b.isPublished ? "Published" : "Draft"}</span></td>
                    <td className="p-3">
                      <div className="flex items-center gap-1">
                        <button onClick={() => setEditing(b)} className="p-1.5" aria-label="Edit"><Pencil size={15} /></button>
                        <button onClick={() => togglePublish(b)} className="p-1.5" aria-label="Toggle publish"><Check size={15} color={b.isPublished ? "#2F7A4F" : "#9AA1AE"} /></button>
                        <button onClick={() => archive(b)} className="p-1.5" aria-label="Archive"><Archive size={15} /></button>
                      </div>
                    </td>
                  </tr>
                ))}
                {filtered.length === 0 && <tr><td colSpan={6} className="p-6 text-center text-sec text-sm">No books found.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {(creating || editing) && (
        <BookForm initial={editing || emptyBook()} onCancel={() => { setCreating(false); setEditing(null); }}
          onSave={(data) => editing ? saveEdit(editing.id, data) : saveNew(data)} />
      )}
    </div>
  );
}

function BookForm({ initial, onSave, onCancel }) {
  const [form, setForm] = useState({ ...initial, whatYouLearnText: (initial.whatYouLearn || []).join("\n"), tocText: (initial.toc || []).join("\n"), badgesText: (initial.badges || []).join(", ") });

  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }

  function submit(e) {
    e.preventDefault();
    const payload = {
      ...form,
      whatYouLearn: form.whatYouLearnText.split("\n").map((s) => s.trim()).filter(Boolean),
      toc: form.tocText.split("\n").map((s) => s.trim()).filter(Boolean),
      badges: form.badgesText.split(",").map((s) => s.trim()).filter(Boolean),
    };
    delete payload.whatYouLearnText; delete payload.tocText; delete payload.badgesText;
    onSave(payload);
  }

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center p-4 overflow-y-auto" style={{ background: "rgba(0,0,0,.5)" }}>
      <form onSubmit={submit} className="card rounded-md p-5 w-full max-w-lg my-6">
        <div className="flex items-center justify-between mb-4">
          <h2 className="serif text-lg font-semibold">{initial.id ? "Edit Book" : "Add Book"}</h2>
          <button type="button" onClick={onCancel}><X size={18} /></button>
        </div>
        <div className="flex flex-col gap-3 max-h-[70vh] overflow-y-auto pr-1">
          <input required placeholder="Title" value={form.title} onChange={(e) => set("title", e.target.value)} className="input-field rounded px-3 py-2 text-sm" />
          <input required placeholder="Author" value={form.author} onChange={(e) => set("author", e.target.value)} className="input-field rounded px-3 py-2 text-sm" />
          <textarea placeholder="Description" value={form.description} onChange={(e) => set("description", e.target.value)} className="input-field rounded px-3 py-2 text-sm" rows={2} />
          <div className="grid grid-cols-2 gap-3">
            <select value={form.audience} onChange={(e) => set("audience", e.target.value)} className="input-field rounded px-3 py-2 text-sm">
              {AUDIENCES.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
            <select value={form.subcategory} onChange={(e) => set("subcategory", e.target.value)} className="input-field rounded px-3 py-2 text-sm">
              {(SUBCATS[form.audience] || []).map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div className="grid grid-cols-3 gap-3">
            <select value={form.access} onChange={(e) => set("access", e.target.value)} className="input-field rounded px-3 py-2 text-sm">
              <option value="PURCHASE">Purchase</option><option value="RENT">Rent</option><option value="FREE">Free</option>
            </select>
            <input type="number" placeholder="Price ₹" value={form.price} onChange={(e) => set("price", e.target.value)} className="input-field rounded px-3 py-2 text-sm" />
            <input type="number" placeholder="Original ₹ (optional)" value={form.originalPrice} onChange={(e) => set("originalPrice", e.target.value)} className="input-field rounded px-3 py-2 text-sm" />
          </div>
          {form.access === "RENT" && (
            <input type="number" placeholder="Rent duration (days)" value={form.rentDurationDays} onChange={(e) => set("rentDurationDays", e.target.value)} className="input-field rounded px-3 py-2 text-sm" />
          )}
          <div className="grid grid-cols-2 gap-3">
            <input placeholder="Age group (e.g. 6-8)" value={form.ageGroup || ""} onChange={(e) => set("ageGroup", e.target.value)} className="input-field rounded px-3 py-2 text-sm" />
            <input type="number" placeholder="Pages" value={form.pages || ""} onChange={(e) => set("pages", e.target.value)} className="input-field rounded px-3 py-2 text-sm" />
          </div>
          <input placeholder="Badges, comma separated (e.g. NEW, BESTSELLER)" value={form.badgesText} onChange={(e) => set("badgesText", e.target.value)} className="input-field rounded px-3 py-2 text-sm" />
          <textarea placeholder="What you'll learn (one per line)" value={form.whatYouLearnText} onChange={(e) => set("whatYouLearnText", e.target.value)} className="input-field rounded px-3 py-2 text-sm" rows={3} />
          <textarea placeholder="Table of contents (one per line)" value={form.tocText} onChange={(e) => set("tocText", e.target.value)} className="input-field rounded px-3 py-2 text-sm" rows={3} />
          <input placeholder="Who this book is for" value={form.whoFor} onChange={(e) => set("whoFor", e.target.value)} className="input-field rounded px-3 py-2 text-sm" />
          <input placeholder="File path/URL (protected ebook file)" value={form.fileUrl} onChange={(e) => set("fileUrl", e.target.value)} className="input-field rounded px-3 py-2 text-sm" />
          <input placeholder="Cover image URL (optional)" value={form.coverUrl || ""} onChange={(e) => set("coverUrl", e.target.value)} className="input-field rounded px-3 py-2 text-sm" />
          <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={form.isPublished} onChange={(e) => set("isPublished", e.target.checked)} /> Published (visible to customers)</label>
          <div>
            <label className="text-xs text-sec block mb-1">Schedule a release (optional) — leave Published unchecked, set a future date/time here to show it under "Coming Soon" with a countdown. It publishes itself automatically once this time passes.</label>
            <input type="datetime-local" value={form.releaseAt ? form.releaseAt.slice(0, 16) : ""} onChange={(e) => set("releaseAt", e.target.value ? new Date(e.target.value).toISOString() : "")} className="input-field rounded px-3 py-2 text-sm w-full" />
          </div>
        </div>
        <div className="flex gap-2 mt-4">
          <button type="button" onClick={onCancel} className="btn-outline rounded-full px-4 py-2 text-sm flex-1">Cancel</button>
          <button type="submit" className="btn-primary rounded-full px-4 py-2 text-sm flex-1">Save</button>
        </div>
      </form>
    </div>
  );
}

function Orders({ token }) {
  const [orders, setOrders] = useState(null);
  useEffect(() => { api("/api/admin/orders", { token }).then(setOrders).catch(() => setOrders([])); }, [token]);
  if (!orders) return <Loader2 size={20} className="spin" />;
  return (
    <div>
      <h1 className="serif text-2xl font-semibold mb-5">Orders</h1>
      {orders.length === 0 ? <p className="text-sm text-sec">No orders yet.</p> : (
        <div className="card rounded-md overflow-hidden overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="text-left text-xs text-sec border-b" style={{ borderColor: "#E1DACB" }}>
              <th className="p-3">User</th><th className="p-3">Items</th><th className="p-3">Amount</th><th className="p-3">Status</th><th className="p-3">Date</th>
            </tr></thead>
            <tbody>
              {orders.map((o) => (
                <tr key={o.id} className="border-b" style={{ borderColor: "#EFEAE0" }}>
                  <td className="p-3">{o.user?.email}</td>
                  <td className="p-3 text-sec">{o.items.map((i) => i.book?.title).join(", ")}</td>
                  <td className="p-3">₹{o.amount}</td>
                  <td className="p-3"><span className={`badge ${o.status === "PAID" ? "badge-green" : "badge-gray"}`}>{o.status}</span></td>
                  <td className="p-3 text-sec">{new Date(o.createdAt).toLocaleDateString()}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function UsersView({ token }) {
  const [users, setUsers] = useState(null);
  useEffect(() => { api("/api/admin/users", { token }).then(setUsers).catch(() => setUsers([])); }, [token]);
  if (!users) return <Loader2 size={20} className="spin" />;
  return (
    <div>
      <h1 className="serif text-2xl font-semibold mb-5">Users</h1>
      <div className="card rounded-md overflow-hidden overflow-x-auto">
        <table className="w-full text-sm">
          <thead><tr className="text-left text-xs text-sec border-b" style={{ borderColor: "#E1DACB" }}>
            <th className="p-3">Name</th><th className="p-3">Email</th><th className="p-3">Role</th><th className="p-3">Joined</th>
          </tr></thead>
          <tbody>
            {users.map((u) => (
              <tr key={u.id} className="border-b" style={{ borderColor: "#EFEAE0" }}>
                <td className="p-3">{u.name}</td>
                <td className="p-3 text-sec">{u.email}</td>
                <td className="p-3"><span className={`badge ${u.role === "ADMIN" ? "badge-green" : "badge-gray"}`}>{u.role}</span></td>
                <td className="p-3 text-sec">{new Date(u.createdAt).toLocaleDateString()}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
